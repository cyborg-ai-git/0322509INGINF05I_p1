#=======================================================================================================================
[workspace]
members = ["tests/support"]
resolver = "3"

[package]
name = "app_atm"
version = "2026.5.310253"
edition = "2024"
rust-version = "1.96"
description = "Simulazione ATM distribuita con mutua esclusione Token Ring e TCP locale."
license = "MIT"
#=======================================================================================================================
[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
#-----------------------------------------------------------------------------------------------------------------------
#=======================================================================================================================
[dev-dependencies]
criterion = "0.8.2"
atm_test_support = { path = "tests/support" }
portable-pty = "0.9.0"
tempfile = "3"
#=======================================================================================================================
[[bench]]
name = "bench_transaction"
harness = false

[[bench]]
name = "bench_token_processing"
harness = false

[[bench]]
name = "bench_message_codec"
harness = false
#=======================================================================================================================

[[bench]]
name = "bench_tcp"
harness = false

[[bench]]
name = "bench_shared_file"
harness = false

[[bench]]
name = "bench_udp_log"
harness = false
